<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — HEA Link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="r" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="o" style="width:520px;height:520px;background:#2563eb;left:-120px;top:-100px"></div>
        <div class="o" style="width:460px;height:460px;background:#14b8a6;right:-100px;top:180px"></div>
        <div class="o" style="width:480px;height:480px;background:#7c3aed;left:30%;bottom:-160px"></div>

        <div class="z" style="max-width: 460px; width: 100%; padding: 20px; text-align: center;">
            <div class="g c" style="padding: 40px 30px;">
                <span style="width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#38bdf8,#2563eb);box-shadow:0 0 25px rgba(56,189,248,.6);display:inline-block;margin-bottom:16px;"></span>
                
                <h2 style="font-size: 22px; margin-bottom: 8px;" id="statusTitle">Connecting you...</h2>
                <p class="m" style="font-size: 13px; margin-bottom: 24px;" id="statusMsg">Redirecting to your destination in a moment.</p>

                <div id="actionArea" style="display: none;">
                    <a href="index.html" class="b" style="padding: 10px 22px; font-size: 14px;">Return to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let code = params.get('c');
        if (!code && window.location.hash) {
            code = window.location.hash.replace('#', '');
        }

        const titleEl = document.getElementById('statusTitle');
        const msgEl = document.getElementById('statusMsg');
        const actionArea = document.getElementById('actionArea');

        if (!code) {
            titleEl.textContent = 'Invalid Link';
            msgEl.textContent = 'No short code was provided in the URL.';
            actionArea.style.display = 'block';
        } else {
            // Retrieve links
            let links = [];
            try {
                links = JSON.parse(localStorage.getItem('hea_links') || '[]');
            } catch(e) {
                links = [];
            }

            // Fallback default seeds if empty
            if (links.length === 0) {
                links = [
                    { id: 1, code: 'summer-sale', long_url: 'https://google.com', clicks: 42, mobile_clicks: 28, desktop_clicks: 14 },
                    { id: 2, code: 'launch-offer', long_url: 'https://youtube.com', clicks: 128, mobile_clicks: 86, desktop_clicks: 42 },
                    { id: 3, code: 'vip-pass', long_url: 'https://github.com', clicks: 19, mobile_clicks: 11, desktop_clicks: 8 }
                ];
            }

            const target = links.find(l => l.code.toLowerCase() === code.toLowerCase());

            if (target && target.long_url) {
                // Increment click counter
                target.clicks = (target.clicks || 0) + 1;
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    target.mobile_clicks = (target.mobile_clicks || 0) + 1;
                } else {
                    target.desktop_clicks = (target.desktop_clicks || 0) + 1;
                }

                localStorage.setItem('hea_links', JSON.stringify(links));

                titleEl.textContent = 'Redirecting...';
                msgEl.textContent = `Forwarding to: ${target.long_url}`;

                setTimeout(() => {
                    window.location.replace(target.long_url);
                }, 300);
            } else {
                titleEl.textContent = '404 — Link Not Found';
                msgEl.textContent = `The short link "/${code}" does not exist or has expired.`;
                actionArea.style.display = 'block';
            }
        }
    </script>
</body>
</html>
